# ══════════════════════════════════════════════════════════════════════════════
# HUGO BLOX CONFIGURATION
# Schema: hugoblox.com/schema/v2
# Documentation: https://hugoblox.com/docs/
# ══════════════════════════════════════════════════════════════════════════════
hugoblox:
  schema: "2.0"

  identity:
    name: "ECAD WIKI"
    organization: "prostep ivip association"
    type: organization
    tagline: ""
    description: "Home of the standards KBL & VEC published by the VES-WF / ECAD-IF."
    social:
      twitter: ""

  theme:
    mode: light
    pack: "default"
    colors:
      primary: "#2b94c3"   # prostep blue (former wiki hero)
      secondary: "#0b2a44" # prostep navy (home page hero)
      neutral: ""

  typography:
    pack: "modern"

  layout:
    radius: "md"
    spacing: "comfortable"
    avatar_shape: circle

  header:
    enable: true
    style: navbar
    # The logo already contains the organisation name.
    show_title: false
    sticky: true
    align: left
    search: true
    theme_toggle: false
    theme_picker: false
    language_switcher: false
    cta:
      enable: false

  footer:
    style: minimal
    language_switcher: false
    text: ""

  copyright:
    notice: "© {year} prostep ivip association. This work is licensed under {license}"
    license:
      type: cc
      allow_derivatives: true
      share_alike: false
      allow_commercial: true

  seo:
    title: ""
    ai:
      allow:
        - /
      disallow: []

  content:
    math:
      enable: false
    toc:
      enable: true
    reading_time:
      enable: true

  search:
    enable: true
    suggestions: []
    quick_actions: []

  comments:
    enable: false

  repository:
    enable: true
    url: "https://github.com/prostep-ivip-e-V/vec"
    branch: main
    content_dir: wiki/content

  locale:
    date_format: "Jan 2, 2006"
    time_format: "3:04 PM"
    address_format: en-us

  privacy:
    enable: true

  debug:
    enable: false

# ══════════════════════════════════════════════════════════════════════════════
# ECAD-WIKI SPECIFIC PARAMETERS (used by the `specs` layouts and shortcodes)
# ══════════════════════════════════════════════════════════════════════════════
VEC:
  current_version: "2.2.0"
  current_base_url: "specifications/vec/v220"
  current_classes_url: "specifications/vec/v220/classes"
KBL:
  current_version: "2.5.sr1"
  current_base_url: "specifications/kbl/v25-sr1"
  current_classes_url: "specifications/kbl/v25-sr1/classes"

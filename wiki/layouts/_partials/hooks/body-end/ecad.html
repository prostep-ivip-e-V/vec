{{/* ECAD-WIKI page scripts: figure lightbox and change history toggle. */}}
<script>
(function () {
  /* Lightbox for figures with `lightbox="true"` (former Wowchemy behaviour). */
  document.addEventListener("click", function (e) {
    var img = e.target.closest("img[data-zoomable]");
    if (!img || img.closest("a")) {
      return;
    }
    e.preventDefault();
    var overlay = document.createElement("div");
    overlay.className = "ecad-lightbox";
    var big = document.createElement("img");
    big.src = img.currentSrc || img.src;
    big.alt = img.alt;
    overlay.appendChild(big);
    function close() {
      overlay.remove();
      document.removeEventListener("keydown", onKey);
    }
    function onKey(ev) {
      if (ev.key === "Escape") {
        close();
      }
    }
    overlay.addEventListener("click", close);
    document.addEventListener("keydown", onKey);
    document.body.appendChild(overlay);
  });

  /* "History" link in the page metadata opens the change history. */
  document.querySelectorAll(".specs-history-toggle").forEach(function (link) {
    link.addEventListener("click", function () {
      var details = document.getElementById("history-collapse");
      if (details) {
        details.open = true;
      }
    });
  });
})();
</script>
